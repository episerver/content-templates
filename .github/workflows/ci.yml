name: Continuous integration

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build_test_pack:
    name: Build, test & pack
    runs-on: ubuntu-latest
    env:
      buildConfiguration: release
      versionSuffix: ${{ github.ref == 'refs/heads/develop' && 'pre-' ||  'ci-' }}${{github.RUN_NUMBER }}
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration "$buildConfiguration" --version-suffix "$versionSuffix"
      - name: Test
        run: dotnet test --no-build --configuration "$buildConfiguration"
      - name: Pack
        run: dotnet pack --no-build --configuration "$buildConfiguration" --version-suffix "$versionSuffix"
      - name: Archive packages
        uses: actions/upload-artifact@v6
        with:
          name: packages
          path: artifacts/*.nupkg
          retention-days: 2

